<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>家事項目の管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="store.js"></script><style>
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 50px}h1{font-size:30px;margin:8px 0 18px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 8px #0001}
.grid,.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:#666;margin:10px 0 5px}
input,select,button,a.navbtn{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;background:#fff;color:#1d1d1f}
button,a.navbtn{margin-top:12px;border:0;background:#1d1d1f;color:#fff;font-weight:700;text-decoration:none;display:block;text-align:center}
.secondary{background:#e8e8ed!important;color:#1d1d1f!important}.danger{background:#fff0f0!important;color:#b42318!important}
.small{width:auto;margin:0;padding:7px 10px;font-size:13px}
.stat,.balance{background:#f5f5f7;border-radius:14px;padding:14px}.stat b{display:block;font-size:24px;margin:5px 0}
.balance{text-align:center;margin-top:12px}.big{font-size:28px;font-weight:800}.muted{font-size:13px;color:#777}
.success{padding:10px;margin-top:10px;background:#eef9f1;border-radius:10px;color:#16794a;display:none}
.error{padding:10px;margin-top:10px;background:#fff0f0;border-radius:10px;color:#b42318}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 6px;border-bottom:1px solid #eee;text-align:left}.scroll{overflow-x:auto}
.topnav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.topnav a{flex:1;min-width:110px;margin:0}
.month-title{font-size:22px;font-weight:800;margin:0 0 12px}.total-row td{font-weight:800;background:#fafafa}
@media(max-width:520px){.grid,.summary{grid-template-columns:1fr}}
</style></head><body><main>
<h1>家事項目の管理</h1><a class="navbtn secondary" href="settings.html">← 設定に戻る</a>
<section class="card"><h2>新しい家事を登録</h2><div class="grid"><div><label>家事名</label><input id="name"></div><div><label>金額</label><input id="amount" type="number" min="0"></div></div>
<button id="add">家事項目を追加</button></section>
<section class="card"><h2>登録済みの家事</h2><table><thead><tr><th>家事</th><th>金額</th><th></th></tr></thead><tbody id="list"></tbody></table></section>
<script>
const $=id=>document.getElementById(id),yen=n=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(n);
function render(){const s=KajiStore.snapshot();$("list").innerHTML=s.chores.map(c=>`<tr><td>${c.name}</td><td>${yen(c.amount)}</td><td><button class="secondary small" data-id="${c.id}">削除</button></td></tr>`).join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{if(confirm("削除しますか？"))try{await KajiStore.removeChore(b.dataset.id)}catch(e){alert(e.message)}})}
$("add").onclick=async()=>{const n=$("name").value.trim(),a=Number($("amount").value);if(!n||!Number.isFinite(a)||a<0)return alert("家事名と0円以上の金額を入力してください");try{await KajiStore.addChore(n,a);$("name").value="";$("amount").value=""}catch(e){alert(e.message)}};
KajiStore.subscribe(render);KajiStore.init().then(render);
</script></main></body></html>
