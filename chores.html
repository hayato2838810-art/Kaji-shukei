<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>家事項目の管理</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<style>
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 50px}
h1{font-size:30px;margin:8px 0 18px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 8px #0001}
.grid,.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:#666;margin:10px 0 5px}
input,select,button,a.navbtn{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;background:#fff;color:#1d1d1f}
button,a.navbtn{margin-top:12px;border:0;background:#1d1d1f;color:#fff;font-weight:700;text-decoration:none;display:block;text-align:center}
.secondary{background:#e8e8ed!important;color:#1d1d1f!important}.danger{background:#fff0f0!important;color:#b42318!important}
.small{width:auto;margin:0;padding:7px 10px;font-size:13px}
.stat,.balance{background:#f5f5f7;border-radius:14px;padding:14px}.stat b{display:block;font-size:24px;margin:5px 0}
.balance{text-align:center;margin-top:12px}.big{font-size:28px;font-weight:800}.muted{font-size:13px;color:#777}
.success{padding:10px;margin-top:10px;background:#eef9f1;border-radius:10px;color:#16794a;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 6px;border-bottom:1px solid #eee;text-align:left}.scroll{overflow-x:auto}
.monthCard{background:#f5f5f7;border-radius:14px;padding:14px;margin:10px 0}
.monthHead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.monthDiff{font-weight:800;font-size:18px}.monthTotals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{background:#fff;border-radius:10px;padding:10px}
.topnav{display:flex;gap:8px;margin-bottom:14px}.topnav a{flex:1;margin:0}
@media(max-width:520px){.grid,.summary,.monthTotals{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>家事項目の管理</h1>
<div class="topnav">
<a class="navbtn secondary" href="settings.html">← 設定に戻る</a>
</div>

<section class="card">
<h2>新しい家事を登録</h2>
<div class="grid">
<div><label>家事名</label><input id="newName" placeholder="例：皿洗い"></div>
<div><label>金額</label><input id="newAmount" type="number" min="0" inputmode="numeric" placeholder="例：100"></div>
</div>
<button type="button" id="addChore">家事項目を追加</button>
<div id="savedMsg" class="success">家事項目を追加しました</div>
</section>

<section class="card">
<h2>登録済みの家事</h2>
<div class="scroll">
<table>
<thead><tr><th>家事</th><th>金額</th><th></th></tr></thead>
<tbody id="master"></tbody>
</table>
</div>
</section>

<script>
const CK="kaji-chores-v4";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const $=id=>document.getElementById(id);
const yen=n=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(n);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch(e){return f}}
let chores=load(CK,[
{id:uid(),name:"皿洗い",amount:100},
{id:uid(),name:"洗濯",amount:150},
{id:uid(),name:"掃除",amount:200},
{id:uid(),name:"料理",amount:300}
]);

function persist(){try{localStorage.setItem(CK,JSON.stringify(chores));return true}catch(e){alert("保存できませんでした。");return false}}
function render(){
 $("master").innerHTML=chores.length?chores.map(c=>`<tr><td>${esc(c.name)}</td><td>${yen(c.amount)}</td><td><button type="button" class="secondary small" onclick="delChore('${c.id}')">削除</button></td></tr>`).join(""):'<tr><td colspan="3">家事項目がありません</td></tr>';
}
$("addChore").addEventListener("click",()=>{
 const name=$("newName").value.trim(),amount=Number($("newAmount").value);
 if(!name){alert("家事名を入力してください");return}
 if(!Number.isFinite(amount)||amount<0){alert("0円以上の金額を入力してください");return}
 chores.push({id:uid(),name,amount});
 if(persist()){
  $("newName").value="";$("newAmount").value="";render();$("savedMsg").style.display="block";setTimeout(()=>$("savedMsg").style.display="none",1200);
  if(cloudReady()) pushChores();
}
});
window.delChore=id=>{
 const c=chores.find(x=>x.id===id);
 if(c&&confirm(`「${c.name}」を削除しますか？`)){
  chores=chores.filter(x=>x.id!==id);
  if(persist()){render();if(cloudReady())pushChores()}
}
};
render();
(async()=>{
  if(cloudReady()){
    await initCloud();
    if(await pullCloudData()) render();
    startCloudRealtime(render);
    setInterval(async()=>{if(await pullCloudData())render()},CLOUD_POLL_MS);
  }
})();
</script>
</main></body></html>
