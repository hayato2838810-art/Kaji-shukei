<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>家事分担</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 50px}
h1{font-size:30px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 8px #0001}
.grid,.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:#666;margin:10px 0 5px}
input,select,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;background:#fff;color:#1d1d1f}
button{margin-top:12px;border:0;background:#1d1d1f;color:#fff;font-weight:700}
.secondary{background:#e8e8ed;color:#1d1d1f}.danger{background:#fff0f0;color:#b42318}.small{width:auto;margin:0;padding:7px 10px;font-size:13px}
.stat,.balance{background:#f5f5f7;border-radius:14px;padding:14px}.stat b{display:block;font-size:24px;margin:5px 0}
.balance{text-align:center;margin-top:12px}.big{font-size:28px;font-weight:800}.muted{font-size:13px;color:#777}
.success{padding:10px;margin-top:10px;background:#eef9f1;border-radius:10px;color:#16794a;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 6px;border-bottom:1px solid #eee;text-align:left}.scroll{overflow-x:auto}
.barRow{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;margin:12px 0}
.barBg{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:3px 0}.bar1{height:100%;background:#333}.bar2{height:100%;background:#999}
@media(max-width:520px){.grid,.summary{grid-template-columns:1fr}.barRow{grid-template-columns:58px 1fr 80px}}
</style>
</head>
<body>
<main>
<h1>家事分担</h1>

<section class="card">
<h2>家事を記録</h2>
<div class="grid">
<div><label>担当者</label><select id="person"></select></div>
<div><label>日付</label><input id="date" type="date"></div>
</div>
<label>実施した家事</label>
<select id="chore"></select>
<p id="amountText" class="muted"></p>
<button type="button" id="addRecord">この家事を記録する</button>
<div id="savedMsg" class="success">記録しました</div>
</section>

<section class="card">
<h2>現在の集計</h2>
<div id="summary" class="summary"></div>
<div id="balance" class="balance"></div>
</section>

<section class="card">
<h2>月別の金額推移</h2>
<div id="monthly"></div>
<p id="legend" class="muted"></p>
</section>

<section class="card">
<h2>記録履歴</h2>
<div class="scroll">
<table>
<thead><tr><th>日付</th><th>担当</th><th>家事</th><th>金額</th><th></th></tr></thead>
<tbody id="history"></tbody>
</table>
</div>
<button type="button" id="reset" class="danger">家事の記録をすべてリセット</button>
<p class="muted">家事項目と金額は残り、実施履歴だけ削除します。</p>
</section>

<section class="card">
<h2>2人の設定</h2>
<div class="grid">
<div><label>1人目</label><input id="p1"></div>
<div><label>2人目</label><input id="p2"></div>
</div>
<button type="button" id="saveNames" class="secondary">名前を保存</button>
</section>

<section class="card">
<h2>家事を追加</h2>
<p class="muted">「皿洗い 100円」のような家事項目を追加します。</p>
<div class="grid">
<div><label>家事名</label><input id="newName" placeholder="例：皿洗い"></div>
<div><label>金額</label><input id="newAmount" type="number" min="0" inputmode="numeric" placeholder="例：100"></div>
</div>
<button type="button" id="addChore">家事項目を追加</button>
<h3>登録済みの家事</h3>
<div class="scroll">
<table>
<thead><tr><th>家事</th><th>金額</th><th></th></tr></thead>
<tbody id="master"></tbody>
</table>
</div>
</section>

<script>
const CK="kaji-chores-v4",RK="kaji-records-v4",NK="kaji-names-v4";
const OLD_CK="kaji-chores-v2",OLD_RK="kaji-records-v2",OLD_NK="kaji-names-v2";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const $=id=>document.getElementById(id);
const yen=n=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(n);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function load(key,fallback){
  try{
    const v=localStorage.getItem(key);
    return v===null?fallback:JSON.parse(v);
  }catch(e){ return fallback; }
}

let chores=load(CK,null) || load(OLD_CK,null) || [
{id:uid(),name:"皿洗い",amount:100},
{id:uid(),name:"洗濯",amount:150},
{id:uid(),name:"掃除",amount:200},
{id:uid(),name:"料理",amount:300}
];
let records=load(RK,null);
if(records===null) records=load(OLD_RK,[]);
let names=load(NK,null) || load(OLD_NK,["自分","パートナー"]);

$("date").value=new Date().toISOString().slice(0,10);
$("p1").value=names[0];
$("p2").value=names[1];

function persist(){
  try{
    localStorage.setItem(CK,JSON.stringify(chores));
    localStorage.setItem(RK,JSON.stringify(records));
    localStorage.setItem(NK,JSON.stringify(names));
    return true;
  }catch(e){
    alert("保存できませんでした。Safariのサイトデータ設定をご確認ください。");
    return false;
  }
}

function updateAmount(){
  const c=chores.find(x=>x.id===$("chore").value);
  $("amountText").textContent=c?`この家事の金額：${yen(c.amount)}`:"";
}

function renderMonthly(){
  const map={};
  records.forEach(r=>{
    const month=(r.date||"").slice(0,7);
    const p=Number(r.person);
    if(!month || (p!==0 && p!==1)) return;
    if(!map[month]) map[month]=[0,0];
    map[month][p]+=Number(r.amount)||0;
  });

  const months=Object.keys(map).sort();
  if(!months.length){
    $("monthly").innerHTML='<p class="muted">記録すると月別推移が表示されます。</p>';
    $("legend").textContent="";
    return;
  }

  const max=Math.max(...months.flatMap(m=>map[m]),1);
  $("monthly").innerHTML=months.map(m=>{
    const a=map[m];
    const w1=Math.round(a[0]/max*100);
    const w2=Math.round(a[1]/max*100);
    return `<div class="barRow">
      <div>${m.replace("-","/")}</div>
      <div>
        <div class="barBg"><div class="bar1" style="width:${w1}%"></div></div>
        <div class="barBg"><div class="bar2" style="width:${w2}%"></div></div>
      </div>
      <div>${yen(a[0])}<br>${yen(a[1])}</div>
    </div>`;
  }).join("");
  $("legend").textContent=`上段：${names[0]}　下段：${names[1]}`;
}

function render(){
  $("person").innerHTML=names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join("");

  $("master").innerHTML=chores.length
    ? chores.map(c=>`<tr><td>${esc(c.name)}</td><td>${yen(c.amount)}</td><td><button type="button" class="secondary small" onclick="delChore('${c.id}')">削除</button></td></tr>`).join("")
    : '<tr><td colspan="3">家事項目がありません</td></tr>';

  $("chore").innerHTML=chores.length
    ? chores.map(c=>`<option value="${c.id}">${esc(c.name)}（${yen(c.amount)}）</option>`).join("")
    : '<option value="">家事を追加してください</option>';

  updateAmount();

  const total=[0,0],count=[0,0];
  records.forEach(r=>{
    const p=Number(r.person);
    if(p===0||p===1){ total[p]+=Number(r.amount)||0; count[p]++; }
  });

  $("summary").innerHTML=[0,1].map(i=>`<div class="stat"><span class="muted">${esc(names[i])}</span><b>${yen(total[i])}</b><span>${count[i]}件</span></div>`).join("");

  const d=total[0]-total[1];
  $("balance").innerHTML=d===0
    ? `<div class="muted">現在の差分</div><div class="big">±${yen(0)}</div><div>2人の負担は同額です</div>`
    : d>0
    ? `<div class="muted">現在の差分</div><div class="big">+${yen(d)}</div><div>${esc(names[0])}の方が ${yen(Math.abs(d))} 多く家事をしています</div>`
    : `<div class="muted">現在の差分</div><div class="big">−${yen(Math.abs(d))}</div><div>${esc(names[1])}の方が ${yen(Math.abs(d))} 多く家事をしています</div>`;

  $("history").innerHTML=records.length
    ? records.slice().reverse().map((r,j)=>{
        const i=records.length-1-j;
        return `<tr><td>${esc(r.date)}</td><td>${esc(names[Number(r.person)]||"不明")}</td><td>${esc(r.choreName)}</td><td>${yen(r.amount)}</td><td><button type="button" class="secondary small" onclick="delRecord(${i})">削除</button></td></tr>`;
      }).join("")
    : '<tr><td colspan="5">まだ記録がありません</td></tr>';

  renderMonthly();
}

$("chore").addEventListener("change",updateAmount);

$("addRecord").addEventListener("click",()=>{
  const c=chores.find(x=>x.id===$("chore").value);
  if(!c){ alert("先に家事項目を追加してください"); return; }

  const date=$("date").value || new Date().toISOString().slice(0,10);
  const person=Number($("person").value);

  records.push({
    id:uid(),
    date,
    person,
    choreId:c.id,
    choreName:c.name,
    amount:Number(c.amount)
  });

  if(persist()){
    render();
    $("savedMsg").style.display="block";
    setTimeout(()=>$("savedMsg").style.display="none",1200);
  }
});

$("saveNames").addEventListener("click",()=>{
  names=[$("p1").value.trim()||"1人目",$("p2").value.trim()||"2人目"];
  if(persist()){ render(); alert("名前を保存しました"); }
});

$("addChore").addEventListener("click",()=>{
  const name=$("newName").value.trim();
  const amount=Number($("newAmount").value);
  if(!name){ alert("家事名を入力してください"); return; }
  if(!Number.isFinite(amount)||amount<0){ alert("0円以上の金額を入力してください"); return; }
  chores.push({id:uid(),name,amount});
  $("newName").value="";
  $("newAmount").value="";
  if(persist()) render();
});

$("reset").addEventListener("click",()=>{
  if(confirm("記録した家事をすべてリセットしますか？")){
    records=[];
    if(persist()) render();
  }
});

window.delChore=id=>{
  const c=chores.find(x=>x.id===id);
  if(c && confirm(`「${c.name}」を削除しますか？`)){
    chores=chores.filter(x=>x.id!==id);
    if(persist()) render();
  }
};

window.delRecord=i=>{
  records.splice(i,1);
  if(persist()) render();
};

persist();
render();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</main>
</body>
</html>
