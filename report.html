<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>月別回数表</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<style>
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 50px}
h1{font-size:30px;margin:8px 0 18px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 8px #0001}
a.navbtn{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;font-size:16px;background:#e8e8ed;color:#1d1d1f;font-weight:700;text-decoration:none;display:block;text-align:center;margin-bottom:14px}
.month-title{font-size:22px;font-weight:800;margin:0 0 12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:420px}
th,td{padding:12px 8px;border-bottom:1px solid #eee;text-align:center}
th:first-child,td:first-child{text-align:left}
thead th{background:#f5f5f7}
.total-row td{font-weight:800;background:#fafafa}
.muted{font-size:13px;color:#777}
.empty{padding:30px 10px;text-align:center;color:#777}
</style>
</head>
<body><main>
<h1>月別回数表</h1>
<a class="navbtn" href="index.html">← 家事記録に戻る</a>

<div id="report"></div>

<script>
const CK="kaji-chores-v4",RK="kaji-records-v4",NK="kaji-names-v4";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch(e){return f}}

let chores=load(CK,[]);
let records=load(RK,[]);
let names=load(NK,["自分","パートナー"]);

function renderReport(){
  chores=load(CK,chores);
  records=load(RK,records);
  names=load(NK,names);

  const months=[...new Set(records.map(r=>(r.date||"").slice(0,7)).filter(Boolean))]
    .sort()
    .reverse();

  if(!months.length){
    $("report").innerHTML='<div class="card empty">まだ記録がありません。</div>';
    return;
  }

  const html=months.map(month=>{
    const monthRecords=records.filter(r=>(r.date||"").slice(0,7)===month);

    // Use chores master first, then add any historical chore names that no longer exist in master
    const rows=[];
    const seen=new Set();

    chores.forEach(c=>{
      if(!seen.has(c.name)){
        seen.add(c.name);
        rows.push(c.name);
      }
    });

    monthRecords.forEach(r=>{
      if(r.choreName && !seen.has(r.choreName)){
        seen.add(r.choreName);
        rows.push(r.choreName);
      }
    });

    const countFor=(choreName,personIndex)=>
      monthRecords.filter(r=>r.choreName===choreName && Number(r.person)===personIndex).length;

    let total0=0,total1=0;

    const body=rows.map(name=>{
      const c0=countFor(name,0);
      const c1=countFor(name,1);
      total0+=c0;
      total1+=c1;
      return `<tr>
        <td>${esc(name)}</td>
        <td>${c0}</td>
        <td>${c1}</td>
      </tr>`;
    }).join("");

    return `<section class="card">
      <div class="month-title">${month.replace("-","/")}</div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>家事名称</th>
              <th>${esc(names[0])}</th>
              <th>${esc(names[1])}</th>
            </tr>
          </thead>
          <tbody>
            ${body}
            <tr class="total-row">
              <td>合計</td>
              <td>${total0}</td>
              <td>${total1}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>`;
  }).join("");

  $("report").innerHTML=html;
}

renderReport();
window.addEventListener("pageshow",renderReport);
window.addEventListener("focus",renderReport);
(async()=>{
  if(cloudReady()){
    if(await bootstrapCloud()) renderReport();
    startCloudRealtime(renderReport);
    setInterval(async()=>{if(await pullCloudData())renderReport()},CLOUD_POLL_MS);
  }
})();
</script>
</main></body></html>
