<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>設定</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 50px}
h1{font-size:30px;margin:8px 0 18px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 8px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:#666;margin:10px 0 5px}
input,button,a.navbtn{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;background:#fff;color:#1d1d1f}
button,a.navbtn{margin-top:12px;border:0;background:#1d1d1f;color:#fff;font-weight:700;text-decoration:none;display:block;text-align:center}
.secondary{background:#e8e8ed!important;color:#1d1d1f!important}
.success{padding:10px;margin-top:10px;background:#eef9f1;border-radius:10px;color:#16794a;display:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>設定</h1>
<a class="navbtn secondary" href="index.html">← 家事記録に戻る</a>

<section class="card">
<h2>2人の名前</h2>
<div class="grid">
<div><label>1人目</label><input id="p1"></div>
<div><label>2人目</label><input id="p2"></div>
</div>
<button type="button" id="saveNames">名前を保存</button>
<div id="savedMsg" class="success">名前を保存しました</div>
</section>

<section class="card">
<h2>家事項目</h2>
<a class="navbtn" href="chores.html">家事項目を管理</a>
</section>

<script>
const NK="kaji-names-v4";
const $=id=>document.getElementById(id);
function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch(e){return f}}
let names=load(NK,["自分","パートナー"]);
$("p1").value=names[0];
$("p2").value=names[1];

$("saveNames").addEventListener("click",()=>{
  names=[$("p1").value.trim()||"1人目",$("p2").value.trim()||"2人目"];
  try{
    localStorage.setItem(NK,JSON.stringify(names));
    $("savedMsg").style.display="block";
    setTimeout(()=>$("savedMsg").style.display="none",1200);
  }catch(e){
    alert("保存できませんでした。");
  }
});
</script>
</main></body></html>
